{# Modal form tambah/ubah transaksi. Dipakai di Dashboard dan halaman Transaksi. #}
<div class="modal" id="txModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="txModalTitle">
        <div class="modal-head">
            <h2 id="txModalTitle">Tambah Transaksi</h2>
            <button type="button" class="icon-btn" data-close-modal aria-label="Tutup"><i class="bi bi-x-lg"></i></button>
        </div>
        <form method="post" action="{{ url_for('add_transaction') }}" id="txForm"
              data-add-action="{{ url_for('add_transaction') }}"
              data-edit-action="{{ url_for('edit_transaction', tx_id=0) }}"
              data-income='{{ income_categories|tojson|forceescape }}'
              data-expense='{{ expense_categories|tojson|forceescape }}'>
            <input type="hidden" name="next" value="{{ request.full_path.rstrip('?') }}">

            <div class="type-switch" role="radiogroup" aria-label="Jenis transaksi">
                <label class="type-option type-expense">
                    <input type="radio" name="type" value="expense" checked>
                    <span><i class="bi bi-arrow-up-right"></i> Pengeluaran</span>
                </label>
                <label class="type-option type-income">
                    <input type="radio" name="type" value="income">
                    <span><i class="bi bi-arrow-down-left"></i> Pemasukan</span>
                </label>
            </div>

            <div class="field">
                <label for="txName">Nama transaksi</label>
                <input type="text" id="txName" name="name" maxlength="80" required placeholder="Contoh: Makan siang">
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="txCategory">Kategori</label>
                    <select id="txCategory" name="category" required></select>
                </div>
                <div class="field">
                    <label for="txDate">Tanggal</label>
                    <input type="date" id="txDate" name="date" value="{{ today }}" required>
                </div>
            </div>
            <div class="field">
                <label for="txAmount">Nominal (Rp)</label>
                <input type="number" id="txAmount" name="amount" min="1" step="1" required placeholder="Contoh: 25000" inputmode="numeric">
            </div>
            <div class="field">
                <label for="txNote">Catatan (opsional)</label>
                <input type="text" id="txNote" name="note" maxlength="200" placeholder="Tambahkan catatan">
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" data-close-modal>Batal</button>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Simpan</button>
            </div>
        </form>
    </div>
</div>

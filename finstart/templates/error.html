{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block heading %}Oops!{% endblock %}
{% block content %}
<div class="card empty-state">
    <i class="bi bi-emoji-frown"></i>
    <h2>Error {{ code }}</h2>
    <p>{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard') }}"><i class="bi bi-house"></i> Kembali ke Dashboard</a>
</div>
{% endblock %}
